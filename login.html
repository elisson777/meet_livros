<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Área de Login</title>
</head>
<body>

    <main>

        <section class="sessao-imagem">
            <img src="IMG/agamenon.jpg" alt="agamenom">
        </section>
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Noir<span>Books</span></h1>
                <h2>Cada pagina uma historia</h2>
            </div>
                        <!--- area de login___formulario -->
            <form action="#" method="post" id="form-login">

                <label for="E-mail">E-mail</label>
                <input type="text" id="E-mail" placeholder="E-mail anta">

                <label for="senha">senha</label>
                <input type="password" id="senha" placeholder="senha agora retardado">
                
                <div class="link-senha">
                    <input type="checkbox" id="lembrar-senha">
                    <label for="lembrar-senha">lembrar senha</label>

                    <a href="#" id="link-esqueceu-conta"> esqueceu a senha</a>

                </div>
                <button id="btn-aceessar"> acessar </button>
                <a href="link-nao-tem-conta">ainda nao tem conta</a>


            </form>
        </section>


    </main>

    
</body>
</html>
