<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    
    <title>Área de Login</title>
</head>
<body>

    <main>

        <section class="sessao-imagem">
            <img src="IMG/agamenon.jpg" alt="Casal numa livraria">
        </section>
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Noir<span>Books</span></h1>
                <h2>Faca login Anta </h2>
            </div>

            <form action="#" id="form-login">

                <label for="email"> Usuário ou Email</label>
                <input type="text" id="email" placeholder="Informe seu email">
                
                <label for="senha"> Senha </label>
                <input type="password" id="senha" placeholder="Informe sua senha">

                <div class="links-senha"> 
                    <input type="checkbox" id="lembrar-senha">
                    <label for="lembrar-senha"> Lembrar senha </label>
                    
                    <a href="index.html" id="link-esqueceu-senha"> Esqueceu a senha? </a>
                </div>

                <label id="msg-login"> </label>

                <button type="button" id="btn-acessar"> Acessar </button>
                <a href="cadastro.html" id="cadastre-se"> Ainda não possuo uma conta </a>

            </form>

        </section>

    </main>
<script src="login.js"></script>
</body>
</html>
